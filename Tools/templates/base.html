<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}MobiScan{% endblock %} | OWASP MASTG Scanner</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        /* Inline font import for reliability */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap');
    </style>
    {% block head %}{% endblock %}
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-brand">
                <div class="brand-icon">MS</div>
                <div class="brand-text">
                    <h1>MobiScan</h1>
                    <span>OWASP MASTG</span>
                </div>
            </div>

            <nav class="sidebar-nav">
                <div class="nav-section">
                    <div class="nav-section-title">Main</div>
                    <a href="/" class="nav-item {% block nav_dashboard %}{% endblock %}">
                        <span class="nav-icon">📊</span>
                        Dashboard
                    </a>
                    <a href="/upload" class="nav-item {% block nav_upload %}{% endblock %}">
                        <span class="nav-icon">📤</span>
                        New Scan
                    </a>
                </div>

                <div class="nav-section">
                    <div class="nav-section-title">Analysis</div>
                    <a href="/compare" class="nav-item {% block nav_compare %}{% endblock %}">
                        <span class="nav-icon">🔀</span>
                        App Comparison
                    </a>
                    <a href="/frida-scripts" class="nav-item {% block nav_frida %}{% endblock %}">
                        <span class="nav-icon">🎭</span>
                        Frida Scripts
                    </a>
                    <a href="/mastg-tests" class="nav-item {% block nav_mastg %}{% endblock %}">
                        <span class="nav-icon">📋</span>
                        MASTG Tests
                    </a>
                    <a href="/dynamic" class="nav-item {% block nav_dynamic %}{% endblock %}">
                        <span class="nav-icon">⚡</span>
                        Dynamic Analysis
                    </a>
                </div>

                <div class="nav-section">
                    <div class="nav-section-title">Resources</div>
                    <a href="https://mas.owasp.org/MASVS/" target="_blank" class="nav-item">
                        <span class="nav-icon">🔗</span>
                        OWASP MAS
                    </a>
                    <a href="https://mas.owasp.org/MASTG/" target="_blank" class="nav-item">
                        <span class="nav-icon">📖</span>
                        MASTG Guide
                    </a>
                </div>
            </nav>

            <div class="sidebar-footer">
                <div>MobiScan v1.0</div>
                <div style="margin-top:4px; color:var(--accent);">OWASP MASTG Scanner</div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            {% block content %}{% endblock %}
        </main>
    </div>

    <script>
        // Global utility functions
        function showToast(message, type = 'success') {
            const toast = document.createElement('div');
            toast.className = 'toast ' + type;
            toast.innerHTML = message;
            document.body.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.3s';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function formatSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
        }
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
